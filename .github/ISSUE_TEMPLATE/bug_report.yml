name: Bug report
description: Report behavior that is broken, misleading, or unsafe for agent coordination.
title: "Bug: "
labels: ["bug", "status:needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Keep examples minimal and remove secrets, tokens, local private paths, and private transcript content.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should Aegis have done instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Smallest command, cell/session state shape, or scenario that reproduces it.
      placeholder: |
        1. Install/build ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - Not backend-specific
        - OpenCode
        - Codex
        - Pi
        - GitHub Copilot CLI
        - Other
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other / unknown
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Relevant logs, command output, status JSON, or screenshots.
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, tokens, private transcript content, and unrelated local paths.
          required: true
